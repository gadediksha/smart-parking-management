<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - Smart Parking System</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="split-body">

<div class="split-wrapper">
    <!-- Left Section: Image Panel -->
    <div class="split-image-panel">
        <div id="splitBg" class="split-bg-image"></div>
        <div class="split-image-overlay">
            <h2>Join YuktiTech Parking</h2>
            <p>Create an account to access smart slot allocation, billing, and real-time dashboard operations.</p>
        </div>
    </div>

    <!-- Right Section: Registration Form -->
    <div class="split-form-panel">
        <div class="form-wrapper">
            <h2>Create Account</h2>
            <p class="sub-heading">Register a new user or operator account.</p>

            <div id="registerAlert" class="alert-box"></div>

            <form id="registerForm" onsubmit="handleRegister(event)">
                <div class="form-group">
                    <label>Username</label>
                    <input type="text" id="regUsername" placeholder="Enter username (e.g. rahul123)" required autocomplete="username">
                </div>

                <div class="form-group">
                    <label>Password</label>
                    <input type="password" id="regPassword" placeholder="••••••••" required autocomplete="new-password">
                </div>

                <div class="form-group">
                    <label>Account Role</label>
                    <select id="regRole">
                        <option value="User">User / Driver (Customer)</option>
                        <option value="Operator">Parking Operator</option>
                        <option value="Admin">Administrator</option>
                    </select>
                </div>

                <button type="submit" class="btn-primary" style="margin-top: 10px;">Create Account</button>
            </form>

            <p style="margin-top: 20px; font-size: 13px; text-align: center; color: #64748b;">
                Already have an account? 
                <a href="login.html" style="color: #2563eb; text-decoration: none; font-weight: 600;">Sign In here</a>
            </p>
        </div>
    </div>
</div>

<script>
    const API_URL = (window.location.hostname === "localhost" || window.location.hostname === "127.0.0.1" || window.location.protocol === "file:")
        ? "http://127.0.0.1:5000"
        : "https://smart-parking-management-5.onrender.com";

    // Background Image
    const bgElement = document.getElementById("splitBg");
    bgElement.style.backgroundImage = "url('https://images.unsplash.com/photo-1506521781263-d8422e82f27a?auto=format&fit=crop&w=1600&q=80')";

    async function handleRegister(e) {
        e.preventDefault();
        const username = document.getElementById("regUsername").value.trim();
        const password = document.getElementById("regPassword").value.trim();
        const role = document.getElementById("regRole").value;
        const alertBox = document.getElementById("registerAlert");

        if (!username || !password) {
            alertBox.innerText = "Please fill in all fields.";
            alertBox.style.display = "block";
            alertBox.style.background = "#fee2e2";
            alertBox.style.color = "#dc2626";
            return;
        }

        try {
            const res = await fetch(`${API_URL}/api/register`, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ username, password, role })
            });

            const data = await res.json();
            if (data.success) {
                alertBox.innerText = data.message;
                alertBox.style.display = "block";
                alertBox.style.background = "#dcfce7";
                alertBox.style.color = "#15803d";
                setTimeout(() => {
                    window.location.href = "login.html";
                }, 1500);
            } else {
                alertBox.innerText = data.message || "Registration failed!";
                alertBox.style.display = "block";
                alertBox.style.background = "#fee2e2";
                alertBox.style.color = "#dc2626";
            }
        } catch (err) {
            alertBox.innerText = "Cannot connect to server!";
            alertBox.style.display = "block";
            alertBox.style.background = "#fee2e2";
            alertBox.style.color = "#dc2626";
        }
    }
</script>
</body>
</html>
