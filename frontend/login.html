<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Login - Smart Parking System</title>
    <link rel="stylesheet" href="style.css?v=4">
    <style>
        .split-wrap { display: flex; min-height: 100vh; }
        .left-visual {
            flex: 1.2;
            background-size: cover;
            background-position: center;
            position: relative;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 36px;
            color: #fff;
            transition: background-image 0.4s ease;
        }
        .left-visual::after {
            content: "";
            position: absolute;
            inset: 0;
            background: linear-gradient(to top, rgba(3,7,18,0.92), rgba(3,7,18,0.3));
        }
        .visual-z { position: relative; z-index: 2; }
        .right-form {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
        }
        @media (max-width: 820px) { .left-visual { display: none; } }
    </style>
</head>
<body>
    <div class="split-wrap">
        <div class="left-visual" id="loginVisual">
            <div class="visual-z" style="display:flex; justify-content:space-between; align-items:center;">
                <span style="background:#2563eb; padding:6px 14px; border-radius:20px; font-weight:700; font-size:0.85rem;">YuktiTech OS</span>
            </div>
            <div class="visual-z">
                <h1 id="visualHeading" style="font-size:2rem; margin-bottom:8px;">Bareilly Smart Parking Plaza (UP-25)</h1>
                <p style="color:#cbd5e1;">Civil Lines, Bareilly • Min-Heap Allocation • QR Reservation • Per-Minute Billing</p>
            </div>
        </div>

        <div class="right-form">
            <div class="card" style="width:100%; max-width:410px; margin:0;">
                <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:16px;">
                    <h2 id="formTitle">System Login</h2>
                    <button class="theme-btn" onclick="toggleTheme()">🌓 Theme</button>
                </div>

                <label>Username</label>
                <input type="text" id="username" placeholder="Enter username">

                <label>Password</label>
                <input type="password" id="password" placeholder="Enter password">

                <div id="roleWrap" style="display:none;">
                    <label>Select Role</label>
                    <select id="role">
                        <option value="User">Driver / User</option>
                        <option value="Staff">Staff / Gate Attendant</option>
                        <option value="Admin">Administrator</option>
                    </select>
                </div>

                <button class="btn" style="width:100%;" id="submitBtn" onclick="handleAuth()">Sign In</button>

                <p style="margin-top:16px; text-align:center; font-size:0.9rem; color:var(--text-sub);">
                    <span id="toggleText">Don't have an account?</span>
                    <a href="#" style="color:var(--accent); font-weight:700;" onclick="toggleMode()">Register here</a>
                </p>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
    <script>
        let imgIdx = 0;
        function renderLoginVisual() {
            const item = PARKING_VISUALS[imgIdx];
            document.getElementById("loginVisual").style.backgroundImage = `url('${item.url}')`;
            document.getElementById("visualHeading").textContent = item.title;
        }
        function switchLoginPhoto() {
            imgIdx = (imgIdx + 1) % PARKING_VISUALS.length;
            renderLoginVisual();
        }
        renderLoginVisual();

        // Har 5 second me image automatically change hogi
        setInterval(switchLoginPhoto, 5000);
        let isRegister = false;
        function toggleMode() {
            isRegister = !isRegister;
            document.getElementById("formTitle").textContent = isRegister ? "Create Account" : "System Login";
            document.getElementById("submitBtn").textContent = isRegister ? "Register" : "Sign In";
            document.getElementById("roleWrap").style.display = isRegister ? "block" : "none";
            document.getElementById("toggleText").textContent = isRegister ? "Already have an account?" : "Don't have an account?";
        }

        async function handleAuth() {
            const username = document.getElementById("username").value.trim();
            const password = document.getElementById("password").value.trim();
            const role = document.getElementById("role").value;

            const endpoint = isRegister ? "/api/register" : "/api/login";
            try {
                const res = await fetch(API_URL + endpoint, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ username, password, role })
                });
                const data = await res.json();
                if (!data.success) return alert(data.message);

                if (isRegister) {
                    alert(data.message);
                    toggleMode();
                } else {
                    localStorage.setItem("parking_user", data.user);
                    localStorage.setItem("parking_role", data.role);
                    if (data.role === "Admin") window.location.href = "index.html";
                    else if (data.role === "Staff") window.location.href = "staff-dashboard.html";
                    else window.location.href = "user-dashboard.html";
                }
            } catch (err) {
                alert("Backend server is not running on port 5000!");
            }
        }
    </script>
</body>
</html>
